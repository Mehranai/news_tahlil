[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iran-news-intelligence"
version = "0.1.0"
description = "A backend for monitoring foreign news related to Iran."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "APScheduler>=3.11,<4",
    "feedparser>=6.0.12,<7",
    "httpx>=0.28,<1",
    "lxml>=5.4,<7",
    "protego>=0.6,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "trafilatura>=2.0,<3",
    "tzdata>=2025.2",
]

[project.scripts]
news-intel = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
